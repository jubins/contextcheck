name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install core dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build core
        run: npm run build

      - name: Install extension dependencies
        working-directory: vscode
        run: npm install

      - name: Test extension
        working-directory: vscode
        run: npm test

      - name: Build extension
        working-directory: vscode
        run: npm run build

      - name: Package extension (dry run)
        working-directory: vscode
        run: npx --yes @vscode/vsce package --no-dependencies -o /tmp/contextcheck.vsix
