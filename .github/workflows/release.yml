name: Release

# Publishes the npm package (contextcheck-cli) and the VS Code extension
# (jubinsoni.contextcheck) when a v* tag is pushed. Both are versioned in
# lockstep: the tag (e.g. v0.1.1) must match the version in package.json and
# vscode/package.json, or the release fails before publishing anything.

# Triggered by pushing a v* tag, or manually from the Actions tab
# ("Run workflow"). On a tag, the tag must match both package.json versions.
# On a manual run, the version is taken from package.json (no tag needed).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# contents: write lets the final job create the GitHub Release.
permissions:
  contents: write

jobs:
  verify:
    name: Verify versions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Check versions are in sync (and match the tag, if any)
        id: v
        run: |
          CORE=$(node -p "require('./package.json').version")
          EXT=$(node -p "require('./vscode/package.json').version")
          echo "core=$CORE  ext=$EXT  ref=$GITHUB_REF_NAME  event=$GITHUB_EVENT_NAME"
          echo "version=$CORE" >> "$GITHUB_OUTPUT"
          if [ "$CORE" != "$EXT" ]; then
            echo "::error::package.json ($CORE) and vscode/package.json ($EXT) versions are out of sync."
            exit 1
          fi
          # On a tag push, the tag must match the package version.
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            TAG="${GITHUB_REF_NAME#v}"
            if [ "$CORE" != "$TAG" ]; then
              echo "::error::Tag v$TAG does not match package version ($CORE)."
              exit 1
            fi
          fi

  test:
    name: Test & build
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Install & test the extension
        working-directory: vscode
        run: |
          npm install
          npm test
          npm run build

  publish-npm:
    name: Publish to npm
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - run: npm run build
      - name: Publish
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-vscode:
    name: Publish the VS Code extension
    needs: test
    runs-on: ubuntu-latest
    env:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Build core (bundled by the extension)
        run: |
          npm ci
          npm run build
      - name: Install extension deps
        working-directory: vscode
        run: npm install
      - name: Publish to the VS Code Marketplace
        working-directory: vscode
        run: npx --yes @vscode/vsce publish --no-dependencies -p "$VSCE_PAT"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
      # Optional: also publish to Open VSX if an OVSX_PAT secret is set.
      - name: Publish to Open VSX (if configured)
        if: ${{ env.OVSX_PAT != '' }}
        working-directory: vscode
        run: npx --yes ovsx publish --no-dependencies -p "$OVSX_PAT"

  github-release:
    name: Create the GitHub Release
    needs: [verify, publish-npm, publish-vscode]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract this version's changelog notes
        id: notes
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          # Pull the section for this version out of vscode/CHANGELOG.md
          # (between "## [x.y.z]" and the next "## [").
          NOTES=$(awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {grab=1; next}
            grab && /^## \[/ {exit}
            grab {print}
          ' vscode/CHANGELOG.md)
          if [ -z "$NOTES" ]; then NOTES="Release v$VERSION"; fi
          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo ""
            echo "**npm:** https://www.npmjs.com/package/contextcheck-cli/v/$VERSION"
            echo "**VS Code Marketplace:** https://marketplace.visualstudio.com/items?itemName=jubinsoni.contextcheck"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
          NOTES: ${{ steps.notes.outputs.notes }}
        run: |
          TAG="v$VERSION"
          # Ensure the tag exists (manual runs may not have pushed one).
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag "$TAG"
            git push origin "$TAG"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes "$NOTES" --title "$TAG"
          else
            gh release create "$TAG" --title "$TAG" --notes "$NOTES"
          fi

      - name: Move the major-version tag for the GitHub Action
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          # External users reference the Action as `@v1`. Re-point that moving
          # major tag at this release so they get patches automatically.
          MAJOR="v${VERSION%%.*}"
          git tag -f "$MAJOR"
          git push origin "$MAJOR" --force
          echo "Moved $MAJOR to $GITHUB_SHA"
