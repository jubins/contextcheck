name: Release

# Publishes the npm package (contextcheck-cli) and the VS Code extension
# (jubinsoni.contextcheck) when a v* tag is pushed. Both are versioned in
# lockstep: the tag (e.g. v0.1.1) must match the version in package.json and
# vscode/package.json, or the release fails before publishing anything.

# Two ways to release:
#  1. Push a v* tag — publishes the version already in package.json.
#  2. Run manually from the Actions tab ("Run workflow") and pick a bump
#     (patch/minor/major). The workflow bumps both package.json files in
#     lockstep, commits, tags, pushes, then publishes.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump for this release"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

# contents: write lets us push the bump commit/tag and create the Release.
permissions:
  contents: write

jobs:
  verify:
    name: Verify / bump version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git author
        run: |
          git config user.name "Jubin Soni"
          git config user.email "jubinsoni27@gmail.com"

      - name: Bump (manual run) or validate (tag push)
        id: v
        run: |
          CORE=$(node -p "require('./package.json').version")
          EXT=$(node -p "require('./vscode/package.json').version")
          echo "core=$CORE  ext=$EXT  event=$GITHUB_EVENT_NAME"
          if [ "$CORE" != "$EXT" ]; then
            echo "::error::package.json ($CORE) and vscode/package.json ($EXT) versions are out of sync."
            exit 1
          fi

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            # Bump both package.json files in lockstep, commit, tag, push.
            BUMP="${{ github.event.inputs.bump }}"
            NEXT=$(node -e 'const [a,b,c]=require("./package.json").version.split(".").map(Number);const k=process.argv[1];const v=k==="major"?[a+1,0,0]:k==="minor"?[a,b+1,0]:[a,b,c+1];console.log(v.join("."))' "$BUMP")
            echo "Bumping $CORE -> $NEXT ($BUMP)"
            node -e "const f='package.json';const p=require('./'+f);p.version='$NEXT';require('fs').writeFileSync(f,JSON.stringify(p,null,2)+'\n')"
            node -e "const f='vscode/package.json';const p=require('./'+f);p.version='$NEXT';require('fs').writeFileSync(f,JSON.stringify(p,null,2)+'\n')"
            printf '/** Package version. Kept in sync with package.json by the release workflow. */\nexport const VERSION = "%s";\n' "$NEXT" > src/version.ts
            git add package.json vscode/package.json src/version.ts
            git commit -m "Release v$NEXT"
            git tag "v$NEXT"
            git push origin HEAD:"${GITHUB_REF_NAME}"
            git push origin "v$NEXT"
            echo "version=$NEXT" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Tag-push path: publish the committed version; tag must match.
          echo "version=$CORE" >> "$GITHUB_OUTPUT"
          echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            TAG="${GITHUB_REF_NAME#v}"
            if [ "$CORE" != "$TAG" ]; then
              echo "::error::Tag v$TAG does not match package version ($CORE)."
              exit 1
            fi
          fi

  test:
    name: Test & build
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Install & test the extension
        working-directory: vscode
        run: |
          npm install
          npm test
          npm run build

  publish-npm:
    name: Publish to npm
    needs: [verify, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - run: npm run build
      - name: Publish (skip if this version is already on npm)
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "contextcheck-cli@$VERSION" version >/dev/null 2>&1; then
            echo "contextcheck-cli@$VERSION is already published — skipping."
          else
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-vscode:
    name: Publish the VS Code extension
    needs: [verify, test]
    runs-on: ubuntu-latest
    env:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Build core (bundled by the extension)
        run: |
          npm ci
          npm run build
      - name: Install extension deps
        working-directory: vscode
        run: npm install
      - name: Publish to the VS Code Marketplace (skip if already published)
        working-directory: vscode
        run: |
          VERSION=$(node -p "require('./package.json').version")
          PUBLISHED=$(npx --yes @vscode/vsce show jubinsoni.contextcheck --json 2>/dev/null \
            | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{console.log(JSON.parse(d).versions?.[0]?.version||'')}catch{console.log('')}})")
          if [ "$PUBLISHED" = "$VERSION" ]; then
            echo "jubinsoni.contextcheck@$VERSION is already published — skipping."
          else
            npx --yes @vscode/vsce publish --no-dependencies -p "$VSCE_PAT"
          fi
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
      # Optional: also publish to Open VSX if an OVSX_PAT secret is set.
      - name: Publish to Open VSX (if configured)
        if: ${{ env.OVSX_PAT != '' }}
        working-directory: vscode
        run: npx --yes ovsx publish --no-dependencies -p "$OVSX_PAT"

  github-release:
    name: Create the GitHub Release
    needs: [verify, publish-npm, publish-vscode]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.verify.outputs.sha }}

      - name: Extract this version's changelog notes
        id: notes
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          # Pull the section for this version out of vscode/CHANGELOG.md
          # (between "## [x.y.z]" and the next "## [").
          NOTES=$(awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {grab=1; next}
            grab && /^## \[/ {exit}
            grab {print}
          ' vscode/CHANGELOG.md)
          if [ -z "$NOTES" ]; then NOTES="Release v$VERSION"; fi
          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo ""
            echo "**npm:** https://www.npmjs.com/package/contextcheck-cli/v/$VERSION"
            echo "**VS Code Marketplace:** https://marketplace.visualstudio.com/items?itemName=jubinsoni.contextcheck"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
          NOTES: ${{ steps.notes.outputs.notes }}
        run: |
          TAG="v$VERSION"
          # Ensure the tag exists (manual runs may not have pushed one).
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag "$TAG"
            git push origin "$TAG"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes "$NOTES" --title "$TAG"
          else
            gh release create "$TAG" --title "$TAG" --notes "$NOTES"
          fi

      - name: Move the major-version tag for the GitHub Action
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          # External users reference the Action as `@v1`. Re-point that moving
          # major tag at this release so they get patches automatically.
          MAJOR="v${VERSION%%.*}"
          git tag -f "$MAJOR"
          git push origin "$MAJOR" --force
          echo "Moved $MAJOR to $GITHUB_SHA"
