<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Context Check">
  <defs>
    <!-- Deep indigo to blue tile gradient -->
    <linearGradient id="tile" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4338CA"/>
      <stop offset="0.55" stop-color="#3B4FD8"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <!-- Subtle top sheen -->
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- Soft glow behind the mark -->
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.1" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded app tile -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#tile)"/>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#sheen)"/>
  <rect x="4.75" y="4.75" width="118.5" height="118.5" rx="27.25" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.5"/>

  <!-- The C: an open ring, thick rounded stroke, opening to the lower-right.
       Drawn as an arc that starts top-right, sweeps counter-clockwise around
       the left, and stops mid-right so the checkmark completes the gap. -->
  <g filter="url(#soft)">
    <path d="M92 43
             A34 34 0 1 0 92 85"
          fill="none"
          stroke="#ffffff"
          stroke-width="13"
          stroke-linecap="round"/>

    <!-- The checkmark: its long stroke rises out of where the C opens,
         reading as the C's tail flicking up into a check. -->
    <path d="M60 70
             L74 84
             L104 44"
          fill="none"
          stroke="#7CF5C4"
          stroke-width="13"
          stroke-linecap="round"
          stroke-linejoin="round"/>
  </g>
</svg>
